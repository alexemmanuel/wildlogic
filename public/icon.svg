<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c1a14" />
      <stop offset="70%" stop-color="#050a08" />
      <stop offset="100%" stop-color="#020403" />
    </radialGradient>
    <linearGradient id="cyber-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="techno-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bg)" stroke="#10b981" stroke-width="4" stroke-opacity="0.3" />

  <!-- Grid Lines -->
  <g stroke="#10b981" stroke-width="1.5" stroke-opacity="0.15">
    <line x1="64" y1="128" x2="448" y2="128" />
    <line x1="64" y1="192" x2="448" y2="192" />
    <line x1="64" y1="256" x2="448" y2="256" />
    <line x1="64" y1="320" x2="448" y2="320" />
    <line x1="64" y1="384" x2="448" y2="384" />
    
    <line x1="128" y1="64" x2="128" y2="448" />
    <line x1="192" y1="64" x2="192" y2="448" />
    <line x1="256" y1="64" x2="256" y2="448" />
    <line x1="320" y1="64" x2="320" y2="448" />
    <line x1="384" y1="64" x2="384" y2="448" />
  </g>

  <!-- Central Hex Tactical Icon / Cyber Beast Mask -->
  <g filter="url(#glow)">
    <!-- Outer Hex Shield -->
    <polygon points="256,92 384,166 384,314 256,388 128,314 128,166" 
             fill="none" stroke="url(#techno-cyan)" stroke-width="6" stroke-dasharray="8 4" />

    <!-- Inner Beast Visor / Predator Head Geometry -->
    <path d="M256,128 L340,180 L320,290 L256,340 L192,290 L172,180 Z" 
          fill="#0a1f18" stroke="url(#cyber-amber)" stroke-width="5" />

    <!-- Bio-cybernetic Stalker Eye Slits -->
    <path d="M200,220 L240,230 L220,245 Z" fill="#fbbf24" />
    <path d="M312,220 L272,230 L292,245 Z" fill="#fbbf24" />

    <!-- Logic Node Nodes & Circuit Bus -->
    <circle cx="256" cy="190" r="10" fill="#10b981" />
    <line x1="256" y1="200" x2="256" y2="280" stroke="#10b981" stroke-width="4" />
    <circle cx="256" cy="280" r="7" fill="#fbbf24" />

    <line x1="256" y1="240" x2="210" y2="265" stroke="#10b981" stroke-width="3" />
    <circle cx="210" cy="265" r="5" fill="#34d399" />

    <line x1="256" y1="240" x2="302" y2="265" stroke="#10b981" stroke-width="3" />
    <circle cx="302" cy="265" r="5" fill="#34d399" />

    <!-- Tactical Fang / Antennae -->
    <path d="M236,310 L256,335 L276,310" stroke="#f59e0b" stroke-width="4" fill="none" stroke-linecap="round" />
  </g>

  <!-- Title Monogram Badge -->
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" 
        fill="#34d399" text-anchor="middle" letter-spacing="6">WILD LOGIC</text>
  <text x="256" y="468" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" 
        fill="#94a3b8" text-anchor="middle" letter-spacing="4">TACTICAL SURVIVAL GRID</text>
</svg>
